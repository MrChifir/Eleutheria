[package]
name = "eleutheria-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1.10"
hex = "0.4.3"
keyring = "4.2.0"
qrcode = "0.14.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
russh = "0.64.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "io-util", "fs", "net"] }
urlencoding = "2.1.3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory"] }
