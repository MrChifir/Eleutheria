[package]
name = "eleutheria-cli"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eleutheria-core = { version = "1.0.0", path = "../eleutheria-core" }
rpassword = "7.5.4"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "time"] }

[[bin]]
name = "eleutheria"
path = "src/main.rs"
