[package]
name = "eleutheria-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client service layer for the GUI: DTOs and operations on top of eleutheria-core (no Tauri dependency)"

[dependencies]
eleutheria-core = { path = "../eleutheria-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "process"] }
minisign-verify = "0.3"
base64 = "0.22"

[dev-dependencies]
minisign = "0.7"
