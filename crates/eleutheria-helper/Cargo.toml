[package]
name = "eleutheria-helper"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eleutheria-core = { path = "../eleutheria-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "process", "signal", "sync", "fs", "io-util"] }

[lib]
name = "eleutheria_helper"
path = "src/lib.rs"

[[bin]]
name = "eleutheria-helper"
path = "src/main.rs"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
