name: VLESS + WebSocket (через CDN)
name_en: VLESS + WebSocket (via CDN)
description: Трафик идёт через CDN (Cloudflare), IP сервера не виден ни клиенту, ни DPI. Нужен свой домен, который проксируется CDN (оранжевое облако), режим TLS «Full». Самоподписанный сертификат сервера принимается.
description_en: "Traffic goes through a CDN (Cloudflare), so the server IP is hidden from both the client and DPI. Requires your own domain proxied by the CDN (orange cloud) with TLS mode \"Full\". The server's self-signed certificate is accepted."
