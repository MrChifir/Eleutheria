[package]
name = "eleutheria-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Eleutheria: десктопное приложение (Tauri 2)"

[[bin]]
name = "eleutheria-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eleutheria-app = { path = "../eleutheria-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"

[build-dependencies]
tauri-build = "2"
